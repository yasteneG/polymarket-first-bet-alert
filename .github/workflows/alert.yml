name: Polymarket first-bet alert

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch:         # bouton « Run workflow » pour lancer à la main
    inputs:
      resend_wallet:
        description: "Facultatif : adresse d'un compte dont renvoyer l'alerte"
        required: false
        default: ""

permissions:
  contents: write            # uniquement pour le commit « keepalive » ci-dessous

concurrency:
  group: polymarket-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Mémoire entre deux exécutions (comptes déjà signalés / déjà connus)
      - name: Restaurer l'état
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Chercher les nouveaux gros parieurs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THRESHOLD_USD: ${{ vars.THRESHOLD_USD || '10000' }}
          RESEND_WALLET: ${{ inputs.resend_wallet }}
        run: python alert.py

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}

      # Le bilan (bets.json) est enregistré dans le dépôt pour ne jamais être perdu.
      # GitHub coupe aussi les tâches planifiées d'un dépôt public après 60 jours sans commit :
      # un commit vide au plus une fois tous les 45 jours l'en empêche.
      - name: Enregistrer le bilan
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f bets.json ]; then git add bets.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Bilan mis à jour"
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "keepalive"
          else
            exit 0
          fi
          git pull --rebase --quiet && git push
