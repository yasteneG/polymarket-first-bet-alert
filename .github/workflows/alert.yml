name: Polymarket first-bet alert

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch:         # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write            # uniquement pour le commit « keepalive » ci-dessous

concurrency:
  group: polymarket-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Mémoire entre deux exécutions (comptes déjà signalés / déjà connus)
      - name: Restaurer l'état
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Chercher les nouveaux gros parieurs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THRESHOLD_USD: ${{ vars.THRESHOLD_USD || '10000' }}
        run: python alert.py

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}

      # GitHub coupe les tâches planifiées d'un dépôt public après 60 jours sans commit.
      # Ce petit commit vide, fait au plus une fois tous les 45 jours, l'en empêche.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
