name: Polymarket stats

on:
  schedule:
    - cron: "*/5 * * * *"   # secours : GitHub ne le respecte qu'irrégulièrement
  workflow_dispatch:         # lancé toutes les 5 min par cron-job.org, ou à la main
    inputs:
      report:
        description: "Envoyer le rapport tout de suite"
        type: boolean
        default: false

permissions:
  contents: write            # pour enregistrer stats.json dans le dépôt après chaque rapport

concurrency:
  group: polymarket-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Statistiques entre deux exécutions. Si le cache est perdu, on repart du stats.json du dépôt
      # (sauvegardé à chaque rapport quotidien).
      - name: Restaurer les statistiques
        uses: actions/cache/restore@v4
        with:
          path: stats.json
          key: stats-${{ github.run_id }}
          restore-keys: stats-

      - name: Suivre les achats et envoyer le rapport de 20 h
        id: stats
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_BET_USD: ${{ vars.MIN_BET_USD || '1000' }}
          FORCE_REPORT: ${{ inputs.report }}
        run: python alert.py

      - name: Sauvegarder les statistiques
        if: always()
        uses: actions/cache/save@v4
        with:
          path: stats.json
          key: stats-${{ github.run_id }}

      # Sauvegarde quotidienne dans le dépôt. Le commit garde aussi le dépôt actif :
      # GitHub coupe les tâches planifiées d'un dépôt public après 60 jours sans commit.
      - name: Enregistrer les statistiques dans le dépôt
        if: steps.stats.outputs.reported == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "Statistiques du $(TZ=Europe/Paris date +%d/%m/%Y)"
          git pull --rebase --quiet && git push
